<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terrill Family Student Portal</title>
  <link rel="stylesheet" href="css/portal.css">
</head>
<body>

  <header class="portal-header">
    <h1>Terrill Family Student Portal</h1>
    <p>Select a grade level to access your learning apps & practice tools</p>
  </header>

  <!-- GRADE LEVEL SELECTOR GRID -->
  <main class="grade-grid">
    <button class="grade-card" onclick="openGradeDrawer('grade-5')">
      <div class="grade-badge">5th</div>
      <div class="grade-info">
        <h2>5th Grade Hub</h2>
        <p>Spelling, Math Flashcards & Reading</p>
      </div>
      <span class="arrow">➡️</span>
    </button>

    <button class="grade-card" onclick="openGradeDrawer('grade-12')">
      <div class="grade-badge grade-12-badge">12th</div>
      <div class="grade-info">
        <h2>12th Grade Hub</h2>
        <p>College Prep, Test Practice & Planning</p>
      </div>
      <span class="arrow">➡️</span>
    </button>
  </main>

  <!-- OVERLAY & SLIDE-OUT DRAWER -->
  <div id="drawer-overlay" class="drawer-overlay" onclick="closeGradeDrawer()"></div>

  <aside id="grade-drawer" class="grade-drawer">
    <div class="drawer-header">
      <h2 id="drawer-title">Grade Apps</h2>
      <button class="close-btn" onclick="closeGradeDrawer()">✕</button>
    </div>

    <!-- 5th Grade App Roster -->
    <div id="apps-grade-5" class="app-list" style="display: none;">
      <a href="./spelling-bee/index.html" class="app-button">
        <div class="app-icon bee-bg">🐝</div>
        <div class="app-details">
          <h3>Spelling Bee Hub</h3>
          <p>Practice weekly spelling lists with voice input & sync</p>
        </div>
      </a>
    </div>

    <!-- 12th Grade App Roster -->
    <div id="apps-grade-12" class="app-list" style="display: none;">
      <div style="padding: 20px; color: #7F8C8D;">Coming soon!</div>
    </div>
  </aside>

  <script src="js/portal.js"></script>
</body>
</html>
